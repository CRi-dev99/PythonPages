name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "Version2/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "Version2/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci
        working-directory: Version2/frontend

      - name: Build frontend
        run: npm run build
        working-directory: Version2/frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Disable Jekyll
        run: touch Version2/frontend/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Version2/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Keep newest Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          duplicate_ids="$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts | map(select(.name == "github-pages")) | sort_by(.created_at) | reverse | .[1:][]?.id')"
          if [ -z "$duplicate_ids" ]; then
            echo "No duplicate Pages artifacts found."
            exit 0
          fi
          echo "$duplicate_ids" | while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            echo "Deleting duplicate Pages artifact $artifact_id"
            gh api --method DELETE "repos/$REPOSITORY/actions/artifacts/$artifact_id"
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
