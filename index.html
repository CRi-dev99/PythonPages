<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonPages</title>
    <script>
        (function () {
            var liveUrl = "https://cri-dev99.github.io/PythonPages/";
            var current = new URL(window.location.href);
            var target = new URL(liveUrl);
            var currentPath = current.pathname.replace(/index\.html$/, "");

            if (current.origin !== target.origin || currentPath !== target.pathname) {
                window.location.replace(liveUrl);
            }
        })();
    </script>
    <style>
        :root {
            color: #0f172a;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            width: min(560px, calc(100% - 32px));
            padding: 28px;
            border: 1px solid #d9e2ef;
            border-radius: 8px;
            background: #ffffff;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 28px;
        }

        p {
            color: #475569;
            line-height: 1.5;
        }

        a {
            color: #2563eb;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <h1>PythonPages</h1>
        <p>
            Redirecting to the live Version2 IDE.
        </p>
        <p>
            Open the live app at <a href="https://cri-dev99.github.io/PythonPages/">https://cri-dev99.github.io/PythonPages/</a>.
        </p>
    </main>
</body>
</html>
